name: Fill level data and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run fill_json.py
        run: python fill_json.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages artifacts
        run: |
          mkdir dist
          cp -r macros dist/macros
          cp index.html dist/index.html
          cp main.js dist/main.js
          cp filled_runs.json dist/filled_runs.json

      - name: Upload artifacts to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist/"

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
